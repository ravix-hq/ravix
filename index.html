<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Ravix: a browser workspace for building software with coding agents. Sign in with GitHub, pick a repository, and every piece of work gets its own branch, its own files and its own agent on one persistent cloud machine."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23151a1f%22/><text x=%2250%22 y=%2272%22 text-anchor=%22middle%22 font-family=%22Menlo,monospace%22 font-weight=%22700%22 font-size=%2264%22 fill=%22%23f4f1e9%22>R</text></svg>"
    />
    <title>Ravix</title>
    <script>
      // The saved palette, applied before the stylesheet paints — a module
      // import runs after first paint, which on a light theme is a full frame
      // of near-black. `src/lib/theme.ts` owns this key and `theme.test.ts`
      // asserts the two still agree; `main.tsx` validates the value.
      try {
        var saved = localStorage.getItem("ravix.theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
