# Materializes Infisical `jhgaylor-playground` / prod / `/switchyard` into the
# K8s Secret `switchyard-secrets`.
#
# Switchyard needs more here than its siblings, and the reason is structural
# rather than incidental: sign-in is GitHub, so nobody using this app has a
# Fountain account of their own. Every machine runs on *this deployment's*
# Fountain key, which therefore has to reach the process — and beside it the
# GitHub App's private key, which mints the installation tokens that clone
# private repositories.
#
# The folder must hold:
#
#   FOUNTAIN_API_KEY        the account every machine is built on. Required.
#   SWITCHYARD_SECRET       encrypts stored GitHub tokens at rest
#   GITHUB_APP_ID
#   GITHUB_APP_SLUG
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   GITHUB_PRIVATE_KEY      the App's PEM; escaped newlines are handled
#   GITHUB_WEBHOOK_SECRET   optional
#   SPRITES_TOKEN           optional — with it the terminal and run panels work
#
# The Deployment treats the Secret as optional on purpose. Before it syncs the
# app still serves, signs nobody in, and says on screen which variable is
# missing — which is a far better failure than a pod that will not start and a
# reason buried in `kubectl describe`.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: switchyard-secrets
  namespace: switchyard
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: switchyard
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/switchyard"
        recursive: false
  managedSecretReference:
    secretName: switchyard-secrets
    secretNamespace: switchyard
    creationPolicy: Orphan
