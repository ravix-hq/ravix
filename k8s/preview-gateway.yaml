apiVersion: v1
kind: Service
metadata:
  name: ravix-previews
  namespace: ravix
spec:
  selector:
    app: ravix
  ports:
    - name: previews
      port: 80
      targetPort: 8082
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ravix-previews-tls
  namespace: ravix
spec:
  secretName: ravix-previews-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.preview.ravix.sh"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ravix-previews
  namespace: ravix
spec:
  entryPoints:
    - websecure
  routes:
    - match: "HostRegexp(`^t-[a-f0-9]{32}\\.preview\\.ravix\\.inevitable\\.fyi$`)"
      kind: Rule
      services:
        - name: ravix-previews
          port: 80
  tls:
    secretName: ravix-previews-tls
