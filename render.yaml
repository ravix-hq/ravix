# Render Blueprint for Ravix — https://render.com/docs/blueprint-spec
#
# One web service on two instances, and one Postgres. Nothing
# durable lives in a process: sessions, grants and the prompt queue are rows, so
# a request may land on either instance and a deploy is a rolling swap (ADR
# 0003). The instances form one Erlang cluster and the processes that must not
# exist twice -- a track's transcript follower, a track's preview server, the
# preview reconciler -- are named through `:global`.
#
# The app and the track-preview gateway share the service's single listener
# and are told apart by Host, so both domains below point at this service:
#
#   app.ravix.sh          the app; must match the GitHub App's callback URL
#   *.preview.ravix.sh    track previews (see README, "Enable gateway routing")
#
# Render requires a wildcard's parent to point at Render too, so
# `preview.ravix.sh` is listed; the app answers there and sets nothing.
#
# Secrets (sync: false) are entered in the dashboard when the Blueprint is
# first applied and never live in this file. The app starts without them and
# says on screen which one it is missing — a better failure than a service
# that will not boot.

# Render Projects and Environments (added after the first sync). Resources
# declared at the *root* of a Blueprint keep whatever project they are already
# in on every later sync, which is why the first apply left these outside
# `Ravix` however the dashboard was arranged. The name is matched exactly,
# capital included: a lowercase `ravix` here made a second, empty project
# rather than finding the one that was already there. Declaring them inside an
# environment is what actually places them. A resource must be declared in one
# place only -- root or an environment, never both.
projects:
  - name: Ravix
    environments:
      - name: Production

        services:
          - type: web
            name: ravix
            runtime: docker
            region: oregon
            plan: 0.5c-512mb
            # Two, so that losing one instance is a degraded service rather than an
            # outage. This was 1, and load-bearing at 1: the follower registry and the
            # preview servers were node-local singletons, so a second instance would
            # have split preview ownership and doubled every transcript event, silently.
            # ADR 0003 is what changed that; `rel/env.sh.eex` and RELEASE_COOKIE below
            # are what make these two instances one cluster rather than two.
            numInstances: 2
            dockerfilePath: ./Dockerfile
            # Readiness, not liveness: /healthz answers as soon as the endpoint listens,
            # which an instance whose database pool has not connected would also do.
            # /readyz asks the database first, so an instance joins the rotation when it
            # can actually serve. Deliberately not a cluster check -- the first instance
            # of a deploy has no peers and would wait for a sibling that is waiting for
            # it.
            healthCheckPath: /readyz
            # Migrations run against the database before the new release takes over --
            # which means they run while the *old* release is still serving every
            # request. Every migration must therefore be one the running code survives:
            # add before you read, stop reading before you drop (ADR 0003).
            preDeployCommand: /app/bin/migrate

            # The drain window: Render waits this long after SIGTERM before killing the
            # container. It has to exceed the endpoint's own `shutdown_timeout` (20s, in
            # config/runtime.exs) or the connections that window exists to protect are
            # dropped anyway. Render's own maximum is 300.
            maxShutdownDelaySeconds: 30
            # Deploy a commit to main only once CI (.github/workflows/ci.yml) is green.
            autoDeployTrigger: checksPass
            domains:
              - app.ravix.sh
              - preview.ravix.sh
              - "*.preview.ravix.sh"
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: ravix-db
                  property: connectionString
              # Not listed here, and not an omission: Render injects
              # RENDER_DISCOVERY_SERVICE into every service with more than one instance.
              # It is a DNS name whose A records are the instances' private addresses.
              # `config/runtime.exs` hands it to DNSCluster and `rel/env.sh.eex` gives
              # each instance a node name at the matching address; without both halves
              # the instances run but never meet.
              #
              # The shared secret two nodes need before they will talk. Generated once
              # and held by the service, rather than the per-build cookie a release
              # bakes in: during a deploy the old and new instances are different
              # builds, and with different cookies they would form two clusters, each
              # running its own follower for every open track for the length of the
              # drain.
              - key: RELEASE_COOKIE
                generateValue: true
              # Explicit because it is now multiplied: two instances hold two pools.
              - key: POOL_SIZE
                value: "10"
              - key: FOUNTAIN_URL
                value: https://managoat.com
              # Where GitHub sends a browser back to, and what the App's callback and
              # setup URLs are registered as. Load-bearing: a mismatch here is the one
              # failure that looks like "sign-in is broken".
              - key: PUBLIC_URL
                value: https://app.ravix.sh
              - key: PREVIEW_DOMAIN
                value: preview.ravix.sh
              # Encrypts stored GitHub tokens; sessions are hashes; also seeds the
              # cookie signing key. Generated once by Render and kept with the service.
              - key: RAVIX_SECRET
                generateValue: true
              # The account every machine is built on. Without it there are no
              # projects at all.
              - key: FOUNTAIN_API_KEY
                sync: false
              # The GitHub App: sign-in, repository access, pull requests, issues,
              # checks, and the installation token that clones a private repository.
              # All of them or none of them. The private key is the App's PEM; paste
              # it with its newlines, escaped `\n` also works.
              - key: GITHUB_APP_ID
                sync: false
              - key: GITHUB_APP_SLUG
                sync: false
              - key: GITHUB_CLIENT_ID
                sync: false
              - key: GITHUB_CLIENT_SECRET
                sync: false
              - key: GITHUB_PRIVATE_KEY
                sync: false
              # With it the terminal, the run panel and track previews are live;
              # without it they say so.
              - key: SPRITES_TOKEN
                sync: false
              # Optional, add in the dashboard if wanted:
              #   GITHUB_WEBHOOK_SECRET   read into config and carried on the App, but
              #                           nothing consumes it yet: there is no webhook
              #                           route, so setting it verifies nothing today.


        # The service reaches it over Render's private network (connectionString is
        # the internal URL). No public access: to reach it with psql from outside,
        # add your address here for the duration, or use a shell on the service
        # (`render ssh ravix`).
        databases:
          - name: ravix-db
            databaseName: ravix
            user: ravix
            region: oregon
            # A high-availability standby needs at least one CPU, so this cannot be the
            # 0.1-CPU plan it was: that requirement, not capacity, is what sets this.
            plan: 1c-2g
            postgresMajorVersion: "17"
            # A standby that takes over at the same URL, and it is this field that turns
            # it on -- the first sync applied it exactly as written. An earlier commit
            # removed it on the strength of "I do not see HA in the dashboard", which
            # turned out to be the wrong page: the service, not the database. Restored,
            # because a Blueprint that stops declaring something it configured is a
            # Blueprint that may switch it off on the next sync.
            #
            # HA needs at least one CPU, which is why the plan below is no longer
            # `0.1c-256mb`. Failover terminates every connection at once; Postgrex
            # reconnects on its own, and `queue_target`/`queue_interval` in
            # config/runtime.exs are what make the requests arriving during the gap wait
            # rather than fail.
            highAvailability:
              enabled: true
            ipAllowList: []
